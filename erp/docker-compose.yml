# Despliegue con Docker Compose (PostgreSQL 16 + ERP). No probado en el entorno de desarrollo (sin Docker).
# Uso:  cp .env.example .env  (complete POSTGRES_PASSWORD y SEED_ADMIN_*)
#       docker compose run --rm migrate      # migraciones + catálogos + administrador inicial
#       docker compose up -d app
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      TZ: America/Mexico_City
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 10s
      retries: 5

  migrate:
    build: { context: ., target: builder }
    profiles: ["tools"]
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://erp:${POSTGRES_PASSWORD}@db:5432/erp?schema=public
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrador}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"

  app:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://erp:${POSTGRES_PASSWORD}@db:5432/erp?schema=public
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      STORAGE_DIR: /data/storage
      PG_DUMP_PATH: pg_dump
    volumes:
      - archivos:/data/storage
    ports:
      - "127.0.0.1:3000:3000"   # solo local: publíquelo detrás de Caddy/Nginx con HTTPS

volumes:
  pgdata:
  archivos:
