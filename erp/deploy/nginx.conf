# Alternativa con Nginx (certificado con certbot: sudo certbot --nginx -d erp.mudanzasmetepec.com)
server {
    listen 80;
    server_name erp.mudanzasmetepec.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name erp.mudanzasmetepec.com;
    # ssl_certificate / ssl_certificate_key los agrega certbot
    client_max_body_size 120m;          # fotos y documentos adjuntos
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
